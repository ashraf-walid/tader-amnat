<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أمانات — غير متصل</title>
<script>
(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root,html[data-theme="light"]{
  --bg:#f0f6ff;--fg:#171717;--muted:#64748b;
  --primary:#2563eb;--primary-fg:#ffffff;
  --card-bg:rgba(255,255,255,0.85);--card-border:rgba(255,255,255,0.65);
  --card-shadow:0 4px 32px rgba(37,99,235,0.08),0 1px 4px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.9);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0f172a;--fg:#f1f5f9;--muted:#94a3b8;
  --primary:#3b82f6;--primary-fg:#ffffff;
  --card-bg:rgba(30,41,59,0.85);--card-border:rgba(255,255,255,0.08);
  --card-shadow:0 4px 32px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:var(--fg);
  font-family:system-ui,"Segoe UI","Tahoma","Arial",sans-serif;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;-webkit-font-smoothing:antialiased;
}
.card{
  background:var(--card-bg);border:1px solid var(--card-border);
  box-shadow:var(--card-shadow);border-radius:1.25rem;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:2.5rem 2rem;max-width:420px;width:100%;text-align:center;
  animation:fadeUp .5s ease-out forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.icon-wrap{
  width:72px;height:72px;margin:0 auto 1.5rem;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),#6366f1);
}
.icon-wrap svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
h1{font-size:1.25rem;font-weight:700;margin-bottom:.5rem;line-height:1.5;}
p{color:var(--muted);font-size:.9rem;line-height:1.7;margin-bottom:1.75rem;}
.retry-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--primary);color:var(--primary-fg);
  border:none;border-radius:.75rem;padding:.75rem 2rem;
  font-size:1rem;font-weight:600;cursor:pointer;
  font-family:inherit;transition:opacity .15s,transform .15s;
}
.retry-btn:hover{opacity:.9;transform:scale(1.02);}
.retry-btn:active{transform:scale(.98);}
.retry-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.brand{
  margin-top:2rem;font-size:.8rem;color:var(--muted);opacity:.7;
  letter-spacing:.02em;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <!-- WiFi-off icon (inline SVG) -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يرجى التحقق من اتصالك بالإنترنت ثم إعادة المحاولة</p>
  <button class="retry-btn" onclick="window.location.reload()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    إعادة المحاولة
  </button>
  <div class="brand">أمانات — الأرضيات</div>
</div>
</body>
</html>
